name: DeepSeek Harness
version: "1.1.0"
tagline: DeepSeek's plugin-based agent harness — password front door, always on the latest dsh
description: >-
  DeepSeek Harness (dsh) is DeepSeek's open-source, fully modular agent
  harness: everything is a plugin, and it can work with DeepSeek models or
  any OpenAI-compatible provider you configure (bring your own API keys).


  This package wraps dsh for Umbrel with a small password gate in front of
  it, because dsh's own web sign-in is a one-time launch-token link — not
  something you want in a browser URL. The first time you open the app
  you'll create a password; that password (no username, nothing to look
  up) is your sign-in from then on. The gate exchanges dsh's token
  server-side, so no token ever appears in your browser — and the gate
  session never expires, so signing in is a one-time thing.


  **Updates:** the harness updates itself. On every app start it checks npm
  for the latest dsh release, installs it beside the current one, verifies
  it runs, and only then swaps it in — the previous version is kept as a
  rollback, and a failed update simply keeps the old version serving. Your
  data (providers, API keys, profiles, plugins, sessions) lives separately
  in the app's data folder and is never touched by an update. To freeze on
  a specific version instead, put its version number in
  `data/dsh-version.txt` and restart the app.


  **Scope:** inside the app, the agent's "full access" reaches the app's
  own container and data folder — not the Umbrel host. Its default
  workspace is the data folder's home directory; add more workspaces from
  the dsh interface.


  dsh is a 0.2.x developer preview from DeepSeek (MIT licensed); expect
  occasional breaking changes between releases. This community package is
  maintained by IconicFinesse.
releaseNotes: >-
  1.1.0: a friendlier front door — no username and no Umbrel-issued
  password. The first time you open the app you create your own password,
  and that password signs you in from then on. Existing harness data is
  untouched by the update.
