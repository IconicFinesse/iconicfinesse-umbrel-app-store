version: "1.1.3"
tagline: DeepSeek's plugin-based agent harness — password front door, always on the latest dsh
description: >-
  DeepSeek Harness (dsh) is an open-source agent harness developed by
  DeepSeek AI. It is built on an everything-is-a-plugin architecture and
  powered by Cordis — sessions, workspaces, tools, model providers, and
  automation are all plugins that can be added, swapped, or extended.
  Bring your own model access: DeepSeek models, or any OpenAI-compatible
  provider you configure with your own API keys.


  DeepSeek Harness is in developer preview and iterating rapidly —
  expect compatibility-breaking changes between releases.


  **On Umbrel:** this package installs dsh as a one-click Umbrel app,
  with a small password gate in front of the Web UI (dsh's own sign-in
  is a one-time launch-token link — not something you want in a browser
  URL). First open: you create a password. That password, no username,
  is your sign-in from then on, and the gate session doesn't expire.
  The gate exchanges dsh's token server-side, so no token ever appears
  in your browser.


  **Updates:** the harness updates itself — every app start checks npm
  for the latest dsh, installs it beside the current one, verifies it
  runs, and only then swaps it in, keeping the old version as a
  rollback. Your data (providers, API keys, profiles, plugins,
  sessions) lives separately in the app's data folder and is never
  touched by an update. To freeze on a specific version instead, put
  its version number in `data/dsh-version.txt` and restart the app.


  **Scope:** inside the app, the agent's "full access" reaches the
  app's own container and data folder — not the Umbrel host. Its
  default workspace is the data folder's home directory; add more
  workspaces from the dsh interface.


  Community package maintained by IconicFinesse. Not an official
  DeepSeek release; not affiliated with or endorsed by DeepSeek AI.
  dsh is MIT-licensed software by DeepSeek AI.
releaseNotes: >-
  1.1.3: the app's own password gate is now the only sign-in in front
  of it — Umbrel no longer adds its session check first (the same
  arrangement Jellyfin uses, since it has its own login too). This is
  what lets the app work cleanly over a public address like
  dsh.brauklabs.com: you land on the gate's sign-in screen wherever
  you open it from. Nothing else changes.
