version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: iconicfinesse-dsh_web_1
      APP_PORT: 3081

  # The gate is the public face: a password front door that exchanges dsh's
  # launch token server-side, so no token ever appears in a browser URL.
  # Password-only mode: no username, and until the owner creates a password
  # on first open, the gate serves a one-time setup page. The credential
  # record lives in the shared data folder.
  web:
    image: ghcr.io/iconicfinesse/dsh-umbrel@sha256:26b42351aab16fada41d0255c5f6a459b620262e31fe87ba6c061f7b7d8ff7a8
    entrypoint: ["node", "/usr/local/lib/dsh-gate/gate.js"]
    restart: on-failure
    environment:
      GATE_PORT: "3081"
      GATE_AUTH_MODE: password-only
      GATE_UPSTREAM_HOST: dsh
      GATE_UPSTREAM_PORT: "3080"
      GATE_LINK_FILE: /data/home/dsh-link.txt
      GATE_CONFIG: /data/gate/gate.json
      GATE_SUBTITLE: "on Umbrel — sign in to continue"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    depends_on:
      - dsh

  # The harness itself. The entrypoint keeps the dsh install in the data
  # folder converged to the latest release (see data/dsh-version.txt) and
  # writes the current launch link where the gate can read it.
  dsh:
    image: ghcr.io/iconicfinesse/dsh-umbrel@sha256:26b42351aab16fada41d0255c5f6a459b620262e31fe87ba6c061f7b7d8ff7a8
    restart: on-failure
    stop_grace_period: 30s
    volumes:
      - ${APP_DATA_DIR}/data:/data
