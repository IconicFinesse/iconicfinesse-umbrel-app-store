version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: iconicfinesse-tuxee_web_1
      APP_PORT: 80

  web:
    image: agent0ai/tuxee:v1.3.0@sha256:6e6afffb14ba8067164214ef181c81c4c0f1ebd1c60bfb102fca875b173f30cb
    restart: on-failure
    stop_grace_period: 30s
    environment:
      ROOT_PASSWORD: ${APP_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/state:/var/lib/tuxee
      - ${APP_DATA_DIR}/data/root:/root
      - ${APP_DATA_DIR}/data/init:/init
