name: Tuxee
version: "v1.3.0"
tagline: A tiny Linux workspace for your server — files and persistent terminals in the browser
description: >-
  ⚠️ **Warning:** Tuxee gives you a root terminal and full file access to its
  container in the browser. Treat it like SSH access: only install it if you
  understand what that means, and keep your Umbrel login secure.


  Tuxee is a tiny Debian Linux container with a superb web interface for
  files and (persistent!) terminals — great for admins, perfect for
  AI agents.


  Log in as the Linux user **root** with the app password shown by Umbrel
  on this page. That password is set on first start; your files, terminals,
  and startup scripts persist across restarts and updates.


  **Highlights:**

    - **File manager and persistent terminals:** terminals keep running
      when you log out or reload the page.

    - **Drag 'n' drop anything:** drag files between windows, or drop
      files from your computer straight into the interface or a terminal
      to upload them.

    - **Edit and view:** built-in file editor with syntax highlighting
      and large file support, plus a built-in media viewer.

    - **GUI apps in the browser:** windowed workspace with tabs, drag
      and resize with grid snapping, and convenient auto layouts.

    - **Lightweight and fast:** based on Debian slim with a core written
      in Go — around 20 MB of RAM in normal use and a ~60 MB image.
releaseNotes: >-
  Tuxee v1.3.0 (upstream agent0ai/tuxee, via v1.1.0–v1.3.0): shortcut
  terminals stay open after commands finish, terminal display is preserved
  across connection recovery, less hidden terminal rendering and GUI
  streaming work, command shortcuts in desktop and context menus, a Safari
  terminal WebSocket fix, and mobile/minimized tab label improvements. No
  changes to persistence or login behaviour — files, /root, /init and state
  carry over as before.
